name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker compose
        run: |
          cp .env.production.example .env
          sed -i 's/REPLACE_WITH_openssl_rand_hex_32/ci-admin-key-0123456789abcdef0123456789abcdef/' .env
          sed -i 's/REPLACE_WITH_STRONG_DB_PASSWORD/ci-db-password-0123456789/' .env
          sed -i 's/REPLACE_WITH_STRONG_REDIS_PASSWORD/ci-redis-password-0123456789/' .env
          docker compose config --quiet
