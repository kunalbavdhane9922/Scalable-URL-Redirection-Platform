# ─────────────────────────────────────────────────────────────────────
# Edge reverse proxy.
#
# Routes:
#   /                 → React app
#   /dashboard        → React app (SPA)
#   /assets/*         → React app (immutable cache)
#   /api/*, /health, /metrics → Fastify pool
#   /*                → Fastify redirect handler (short codes)
#
# TLS terminates at Cloudflare; this proxy listens on plain HTTP inside the
# private Docker network and receives requests from cloudflared.
# ─────────────────────────────────────────────────────────────────────

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time '
                    'up=$upstream_addr urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;
    keepalive_timeout 65;
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain;

    # Preserve the original scheme forwarded by Cloudflare / an upstream LB.
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        https   https;
        http    http;
    }

    # Behind a tunnel every request appears to come from a private Docker IP,
    # so an IP allowlist cannot protect /metrics. Require a scrape credential
    # header; the API still validates the value against METRICS_TOKEN.
    map "$http_x_metrics_token$http_authorization" $metrics_denied {
        ""      1;
        default 0;
    }

    upstream api_backend {
        least_conn;
        server app1:3000 max_fails=3 fail_timeout=10s;
        server app2:3000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    upstream web_frontend {
        server frontend:80;
        keepalive 16;
    }

    # Shared proxy defaults for Fastify.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_connect_timeout 2s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
    proxy_buffering on;
    proxy_buffers 8 16k;

    server {
        listen 80 default_server;
        server_name _;

        # Baseline browser hardening (helmet covers API responses).
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # ── Health & metrics ────────────────────────────────────────
        location = /health/live {
            proxy_pass http://api_backend;
            access_log off;
        }

        location = /health/ready {
            proxy_pass http://api_backend;
            access_log off;
        }

        location = /health {
            proxy_pass http://api_backend;
            access_log off;
        }

        location /health/ {
            proxy_pass http://api_backend;
            access_log off;
        }

        # Metrics require a credential header at the edge; the API validates
        # the value. Private-IP checks are meaningless behind the tunnel.
        location = /metrics {
            if ($metrics_denied) {
                return 404;
            }
            proxy_pass http://api_backend;
            access_log off;
        }

        # ── API ─────────────────────────────────────────────────────
        location /api/ {
            proxy_pass http://api_backend;
        }

        # ── React app ───────────────────────────────────────────────
        location /assets/ {
            proxy_pass http://web_frontend;
            proxy_cache_valid 200 1y;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            access_log off;
        }

        location = / {
            proxy_pass http://web_frontend;
        }

        location /dashboard {
            proxy_pass http://web_frontend;
        }

        # Authentication pages are client-side routes, not short codes.
        location ~ ^/(login|register|forgot-password|reset-password|verify-email)/?$ {
            proxy_pass http://web_frontend;
        }

        location = /favicon.ico {
            proxy_pass http://web_frontend;
            access_log off;
        }

        location = /robots.txt {
            proxy_pass http://web_frontend;
            access_log off;
        }

        # ── Short-code redirects (catch-all) ────────────────────────
        location / {
            proxy_pass http://api_backend;
        }
    }
}
